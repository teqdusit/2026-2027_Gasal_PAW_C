<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        .field {
            margin-bottom: 10px;
        }

        .field label {
            display: inline-block;
            width: 130px;
            vertical-align: top;
        }

        .field input[type="text"],
        .field input[type="password"],
        .field select,
        .field textarea {
            width: 200px;
        }
    </style>
</head>

<body>
    <h1>Register</h1>
    <fieldset>
        <legend>Person Details</legend>
        <form name="myForm" action="prosees_data.php" method="POST">
            <div class="field">
                <label for="surname">Surname:</label>
                <input type="text" name="surname" size="31" />
            </div>
            <div class="field">
                <label for="email">Email address:</label>
                <input type="text" name="email" size="31" />
            </div>
            <div class="field">
                <label for="password">Password:</label>
                <input type="password" name="password" size="31" />
            </div>
            <div class="field">
                <label for="address">Street Address:</label>
                <textarea name="address" rows="3" cols="22"></textarea>
            </div>
            <div class="field">
                <label for="state">State:</label>
                <select name="state">
                    <option value="-1" selected>[choose your state]</option>
                    <option value="1">Australian Capital Territory</option>
                    <option value="2">Queensland</option>
                    <option value="3">South Australia</option>
                    <option value="4">Western Australia</option>
                    <option value="5">Tasmania</option>
                    <option value="6">Northern Territory</option>
                    <option value="7">Western Australia</option>
                    <option value="8">New South Wales</option>
                </select>
            </div>
            <div class="field">
                <input type="hidden" name="country" value="Australia" />
            </div>
            <div class="field">
                <label for="sex">Gender:</label>
                <input type="radio" name="sex" value="Male" /> Male
                <input type="radio" name="sex" value="Female" /> Female
            </div>
            <div class="field">
                <label for="vegetarian">Vegetarian?</label>
                <input type="checkbox" name="vegetarian" />
            </div>
            <div class="field">
                <label>&nbsp;</label>
                <input type="submit" value="Submit" name="submit" />
                <input type="reset" value="Reset" name="reset" />
            </div>
        </form>
    </fieldset>
</body>

</html>
